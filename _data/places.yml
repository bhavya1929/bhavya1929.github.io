# =============================================================================
#  PLACES PAGE DATA  ("Beyond the Lab")
#  This is the ONLY file you edit to add cities or places.
#
#  HOW IT WORKS
#  - Each item under `cities:` is one card. It expands in place on click to
#    show two lists: `cafes` and `restaurants`. Either list can be left empty
#    (as `[]`) if a city only has one category — its section just won't show.
#  - The header stats line ("N cities · N places · N countries") is computed
#    automatically from this data. You never edit numbers by hand.
#  - Cities can have any number of places — there's no limit, and nothing
#    else needs to change when you add more.
#
#  TO ADD A CITY: copy a whole `- name:` block under `cities:` and edit it.
#  TO ADD A PLACE: copy one `{ name: ..., note: ... }` line inside `cafes:`
#  or `restaurants:` for the right city.
#  Keep `note:` to one short line — that's the whole design.
#
#  `lat:` / `lon:` are kept for reference only (not used to place the dot).
#  `x:` / `y:` are what actually position the city's dot on the map — this
#  map is a hand-painted illustration, not a real projection, so these were
#  placed by hand with the calibration tool rather than computed from
#  lat/lon. If a NEW city needs to be added, load the page with
#  ?calibrate=1, click its spot on the map, and copy the x/y reading here.
#  The dot's SIZE is still worked out automatically from how many places
#  that city has — you never set a size by hand.
# =============================================================================

tagline: "Some science. A lot of food."

intro: >
  I love travelling for food almost as much as I love travelling itself. I’m always chasing the places locals swear by, cafes
  tucked away on side streets, and meals that randomly pop back into my head on a Monday afternoon.


# =============================================================================
#  EXPERIENCE PAGE DATA
#  This is the ONLY file you edit to add or change content on /experience.
#
#  HOW IT WORKS
#  - Each item under `timeline:` is one card (a job or a degree).
#  - The `skills:` list on a card is what lights up in the sidebar when you
#    hover that card. Just write the skill names normally.
#  - The sidebar is built automatically from every skill your cards mention,
#    in the order they first appear, followed by anything in `extra_skills`.
#    So adding a job with a new skill makes the chip appear on its own —
#    the names can never get out of sync.
#
#  TO ADD A JOB: copy a block below, paste it at the top of `timeline:`
#  (newest first), and edit the fields. `org_url`, `note`, and `current`
#  are all optional — delete the lines you don't need.
# =============================================================================

